[package]
name = "scrap2_bot"
version = "0.1.0"
edition = "2024"

[dependencies]
opencv = "0.95.1"
image = "0.24"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
rayon = "1.5"
rand = "0.8"
crossterm = "0.26"
ocrs = "0.10.4"
winapi = { version = "0.3", features = [
    "winuser",
    "wingdi", 
    "windef",
    "minwindef",
    "libloaderapi"
] }